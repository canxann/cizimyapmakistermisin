<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>Çiçeklerle Çizim</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="app">

    <!-- Rehber / tutorial canvas -->
    <canvas id="guideCanvas"></canvas>

    <!-- Çiçek canvas -->
    <canvas id="canvas"></canvas>


    <div id="tutorialUI">

        <div id="tutorialHint">
            HARFİ ÇİZ
        </div>

        <div id="letterText"></div>

        <div id="progressText"></div>

    </div>


    <div id="completeMessage">

        <div class="completeTitle">
            Tutorial tamamlandı 🌸
        </div>

        <div class="completeSubtitle">
            Artık istediğini çizebilirsin.
        </div>

    </div>


    <button id="clearButton">
        Temizle
    </button>

</div>


<script src="./script.js"></script>

</body>
</html>
